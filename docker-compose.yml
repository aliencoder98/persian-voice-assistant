x-app: &app
  image: persian-assistant:dev
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    AUDIO_DIR: /data/audio

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Same source and parsing as the app containers, so special characters in the password match.
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations, then exits. bot and api wait for it.
  migrate:
    <<: *app
    build: .  # the single place the shared image is built
    # Migrations, then the dashboard's read-only DB role (skipped while DASHBOARD_DB_PASSWORD is empty).
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        if [ -n "$$DASHBOARD_DB_PASSWORD" ]; then python -m app.db.roles;
        else echo "DASHBOARD_DB_PASSWORD is empty: dashboard role skipped"; fi
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    restart: unless-stopped
    volumes:
      - audio:/data/audio
      - ./secrets:/app/secrets:ro  # Google OAuth client file, never baked into the image
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health?shallow=true')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP server (streamable HTTP on 127.0.0.1 only). For stdio clients see the README.
  mcp:
    <<: *app
    command: ["python", "-m", "app.mcp.server", "--transport", "streamable-http", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Demo data so the dashboard charts are not empty before real use (skipped once real usage exists).
  demo-seed:
    <<: *app
    command:
      - sh
      - -c
      - "if [ '${DASHBOARD_DEMO:-1}' = '1' ]; then python -m app.dashboard.demo seed --if-empty; fi"
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Read-only dashboard. No env_file on purpose: it never receives the bot token or any API key,
  # and it connects with the read-only database role.
  dashboard:
    image: persian-assistant:dev
    command: ["uvicorn", "app.dashboard.main:app", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-dashboard_ro}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:-}
      DASHBOARD_BASE_PATH: ${DASHBOARD_BASE_PATH:-}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-0}
      MONTHLY_TOKEN_BUDGET: ${MONTHLY_TOKEN_BUDGET:-0}
      BUDGET_HARD_STOP: ${BUDGET_HARD_STOP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  audio:
