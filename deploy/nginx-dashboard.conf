# Existing nginx in front of the dashboard (PROXY_MODE=nginx).
# Install:  sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/assistant-dashboard
#           (edit server_name and the port if you changed DASHBOARD_PORT)
#           sudo ln -s /etc/nginx/sites-available/assistant-dashboard /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d usage.example.com        # adds HTTPS and the redirect
server {
    listen 80;
    listen [::]:80;
    server_name usage.example.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the dashboard's login throttle uses this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
