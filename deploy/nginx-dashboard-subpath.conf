# Dashboard under a path of a site you already serve, e.g. https://didrah.com/dashboard
# (.env: PROXY_MODE=nginx, DASHBOARD_BASE_PATH=/dashboard, DASHBOARD_PORT=8081)
#
# Add these two location blocks INSIDE the existing `server { ... }` block of that site (the one with
# listen 443 ssl and its certificate); no new certificate or DNS record is needed. Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The trailing slash in proxy_pass strips the /dashboard prefix; the app adds it back to its own links.
# Make sure the site has nothing else at /dashboard (a CMS route or a folder).

location = /dashboard {
    return 301 /dashboard/;
}

location /dashboard/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # the dashboard's login throttle uses this
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
